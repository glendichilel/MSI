<!DOCTYPE html>
<html>
<head>
    <title>PageTurner Bookstore - Order System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f8fafc;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .order-info {
            background: #edf2f7;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .error-box {
            background: #fed7d7;
            border: 2px solid #fc8181;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            color: #c53030;
        }
        
        .success-box {
            background: #c6f6d5;
            border: 2px solid #68d391;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            color: #2f855a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PageTurner Order System</h1>
        
        <div class="order-info">
            <h3>Current Order Status</h3>
            <p>Check the console (F12) to see debugging information!</p>
        </div>
        
        <div class="error-box">
            <strong>Known Issues:</strong>
            <ul>
                <li>Book total shows "NaN"</li>
                <li>Customer name appears before it's defined</li>
                <li>Tax rate keeps changing unexpectedly</li>
            </ul>
        </div>
        
        <div class="success-box" id="results">
            <strong>Fixed Results:</strong>
            <p>Results will appear here after debugging...</p>
        </div>
    </div>

    <script>
        console.log("Starting PageTurner Order System Debug Session");
        let customerName = "Sarah Johnson";
        // BUG 1: Using variable before declaration
        console.log("Welcome " + customerName + "!");
        
        // Step 1: INSTRUCTION - Move this line ABOVE the console.log
        // Replace the blank with "let" to properly declare the variable
        
        
        // BUG 2: Tax rate should never change (using let instead of const)
        // Step 2: INSTRUCTION - Replace blank with "const" to make it unchangeable
        const taxRate = 0.08;
        
        // BUG 3: Trying to calculate with undefined values
        let bookPrice = 25.99;
        // This line is missing - Step 3: INSTRUCTION - Add this line:
        // let quantity = 2;
        let quantity = 2;
        // Calculate totals
        let subtotal = bookPrice * quantity;
        let tax = subtotal * taxRate;
        let total = subtotal + tax;
        
        // Debug logging to track our values
        console.log("Order Calculations:");
        console.log("Book price: $" + bookPrice);
        console.log("Quantity: " + quantity);
        console.log("Subtotal: $" + subtotal.toFixed(2));
        console.log("Tax (8%): $" + tax.toFixed(2));
        console.log("Total: $" + total.toFixed(2));
        
        // Check for errors in our calculations
        if (isNaN(total)) {
            console.error("ERROR: Total calculation failed!");
            console.log("Debug info - bookPrice:", bookPrice, "quantity:", quantity);
        } else {
            console.log("SUCCESS: Order calculated correctly!");
            
            // Update the webpage with results
            document.getElementById('results').innerHTML = 
                "<strong>Fixed Results:</strong><br>" +
                "Customer: " + customerName + "<br>" +
                "Book Price: $" + bookPrice + "<br>" +
                "Quantity: " + quantity + "<br>" +
                "Subtotal: $" + subtotal.toFixed(2) + "<br>" +
                "Tax: $" + tax.toFixed(2) + "<br>" +
                "<strong>Total: $" + total.toFixed(2) + "</strong>";
        }
        
        console.log("Debug session complete!");
    </script>
</body>
</html>
